[project]
name = "logdelta"
version = "0.1.0"
description = "Log analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "drain3>=0.9.11",
    "pytz>=2026.5",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
logdelta="logdelta.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logdelta"]

[tool.basedpyright]
allowedUntypedLibraries = ["drain3"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]


